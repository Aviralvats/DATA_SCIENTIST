<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | AI Data Scientist</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/decoration/login.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <div class="auth-logo">
                AI DS
            </div>

            <div class="auth-header">
                <span class="auth-label">GET STARTED</span>

                <h1>Create Account</h1>

                <p>
                    Create your account and start exploring your data.
                </p>
            </div>

            <form id="signupForm">

                <div class="input-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-submit">
                    Create Account
                </button>

            </form>

            <p id="signupMessage" class="auth-message"></p>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <p class="auth-switch">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </main>

    <script src="/scripts/signup.js"></script>

</body>
</html>
