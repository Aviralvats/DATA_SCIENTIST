<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Data Scientist</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/decoration/login.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <div class="auth-logo">
                AI DS
            </div>

            <div class="auth-header">
                <span class="auth-label">WELCOME BACK</span>

                <h1>Login</h1>

                <p>
                    Sign in to continue to your AI Data Scientist workspace.
                </p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="auth-submit">
                    Login
                </button>

            </form>

            <p id="loginMessage" class="auth-message"></p>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <p class="auth-switch">
                Don't have an account?
                <a href="/signup">Create account</a>
            </p>

        </div>

    </main>

    <script src="/scripts/login.js"></script>

</body>
</html>
